<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KBOSTOCK — KBO 가상 주식 거래소</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080C18;--bg2:#0D1628;--bg3:#111E35;
  --border:#1A2D4A;--gold:#F0B429;
  --green:#0EE07A;--red:#FF3B56;
  --text:#E2E8F7;--muted:#64748B;--r:12px;
}
html,body{background:var(--bg);color:var(--text);min-height:100vh;font-family:'Noto Sans KR',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
.bebas{font-family:'Bebas Neue',sans-serif}
.g{color:var(--green)}.r{color:var(--red)}.gold{color:var(--gold)}.mu{color:var(--muted)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-wrap{overflow:hidden;background:#060A15;border-bottom:1px solid var(--border);height:30px;display:flex;align-items:center}
.ticker-track{display:flex;animation:tick 40s linear infinite;white-space:nowrap;font-size:11px;color:var(--muted)}
.hdr{background:rgba(8,12,24,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue';font-size:24px;color:var(--gold);letter-spacing:3px;cursor:pointer;flex-shrink:0}
.logo span{color:rgba(255,255,255,.5)}
.nav{display:flex;gap:2px;flex:1;justify-content:center}
.nb{background:none;border:none;color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer;font-size:11px;font-family:'Noto Sans KR';font-weight:500;transition:.15s;white-space:nowrap}
.nb:hover{color:var(--text);background:var(--bg3)}
.nb.on{color:var(--gold);background:rgba(240,180,41,.1)}
.ua{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px 10px;text-align:right}
.lbtn{background:var(--gold);color:#000;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:900;font-size:12px;font-family:'Noto Sans KR'}
.obtn{background:var(--bg3);color:var(--muted);border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Noto Sans KR'}
.sbar{text-align:center;padding:8px;font-size:11px;font-weight:700;letter-spacing:1px}
.sopen{background:rgba(14,224,122,.07);color:var(--green);border-bottom:1px solid rgba(14,224,122,.15)}
.sclosed{background:rgba(255,59,86,.06);color:#FF6B81;border-bottom:1px solid rgba(255,59,86,.12)}
.main{max-width:1260px;margin:0 auto;padding:20px 18px}
.stitle{font-family:'Bebas Neue';font-size:19px;letter-spacing:2px;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.stitle::after{content:'';flex:1;height:1px;background:var(--border)}
/* market layout */
.market-layout{display:flex;gap:14px;align-items:flex-start}
.market-main{flex:1;min-width:0}
.standings-panel{width:230px;flex-shrink:0;position:sticky;top:72px}
/* today strip */
.today-strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:16px;scrollbar-width:none}
.today-strip::-webkit-scrollbar{display:none}
.today-card{background:var(--bg2);border:1px solid rgba(14,224,122,.3);border-radius:9px;padding:9px 12px;flex-shrink:0;min-width:150px;background:rgba(14,224,122,.05)}
/* team grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.tc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;transition:.2s}
.tc:hover{border-color:#2A4A72;transform:translateY(-1px)}
/* team logo */
.tlogo{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:inherit}
/* standings table */
.stbl{width:100%;border-collapse:collapse}
.stbl th{font-size:9px;color:var(--muted);font-weight:600;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);letter-spacing:.3px}
.stbl th:nth-child(2){text-align:left}
.stbl td{padding:7px 8px;border-bottom:1px solid rgba(26,45,74,.4);font-size:11px;text-align:center;vertical-align:middle}
.stbl td:nth-child(2){text-align:left}
.stbl tr:last-child td{border-bottom:none}
.stbl tr:hover td{background:var(--bg3)}
.srank{font-family:'Bebas Neue';font-size:14px}
.srank-1{color:#FFD700}.srank-2{color:#C0C0C0}.srank-3{color:#CD7F32}
.srank-ps{color:var(--green)}.srank-bot{color:var(--red)}
/* card elements */
.tn{font-size:11px;font-weight:700;line-height:1.3}
.price{font-family:'IBM Plex Mono';font-size:18px;font-weight:600}
.chg{font-family:'IBM Plex Mono';font-size:11px;font-weight:600}
.rbadge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;font-family:'IBM Plex Mono'}
.ru{background:rgba(14,224,122,.13);color:var(--green)}.rd{background:rgba(255,59,86,.13);color:var(--red)}.req{background:var(--bg3);color:var(--muted)}
.trow{display:flex;gap:6px;margin-top:9px}
.bbtn{flex:1;background:rgba(14,224,122,.12);color:var(--green);border:1px solid rgba(14,224,122,.25);padding:7px;border-radius:7px;cursor:pointer;font-weight:700;font-size:11px;font-family:'Noto Sans KR';transition:.15s}
.bbtn:hover{background:rgba(14,224,122,.22)}
.sbtn{flex:1;background:rgba(255,59,86,.1);color:var(--red);border:1px solid rgba(255,59,86,.22);padding:7px;border-radius:7px;cursor:pointer;font-weight:700;font-size:11px;font-family:'Noto Sans KR';transition:.15s}
.sbtn:hover{background:rgba(255,59,86,.2)}
.dis{opacity:.3;cursor:not-allowed!important}
.hbadge{display:inline-block;background:rgba(240,180,41,.15);color:var(--gold);font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#0B1525;border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:400px}
.mtitle{font-family:'Bebas Neue';font-size:21px;letter-spacing:2px;margin-bottom:16px;color:var(--gold)}
.tabsw{display:flex;gap:5px;margin-bottom:15px}
.tabsw button{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:7px;border-radius:7px;cursor:pointer;font-size:11px;font-family:'Noto Sans KR';transition:.15s}
.tabsw button.on{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.3);color:var(--gold)}
.field{margin-bottom:11px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-size:13px;font-family:'Noto Sans KR';outline:none;transition:.15s}
.field input:focus{border-color:var(--gold)}
.sbmit{width:100%;background:var(--gold);color:#000;border:none;padding:11px;border-radius:9px;font-weight:900;font-size:14px;cursor:pointer;font-family:'Noto Sans KR';margin-top:6px}
.clsbtn{width:100%;background:none;border:none;color:var(--muted);cursor:pointer;margin-top:9px;font-size:11px;font-family:'Noto Sans KR';padding:5px}
.qrow{display:flex;gap:6px;align-items:center;margin-top:5px}
.qbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:17px;flex-shrink:0}
.qinp{flex:1;text-align:center;font-family:'IBM Plex Mono';font-weight:700;font-size:18px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px;border-radius:7px;outline:none}
.maxbtn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:0 9px;height:32px;border-radius:7px;cursor:pointer;font-size:10px;font-family:'Noto Sans KR';flex-shrink:0}
.infobox{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px;margin:12px 0}
.irow{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px}
.irow:last-child{margin-bottom:0}
/* portfolio */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.pcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.plbl{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:4px;letter-spacing:.5px}
.pval{font-family:'IBM Plex Mono';font-size:16px;font-weight:600}
.cwrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.ptbl{width:100%;border-collapse:collapse}
.ptbl th{font-size:9px;color:var(--muted);font-weight:600;padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);letter-spacing:.5px}
.ptbl th:first-child{text-align:left}
.ptbl td{padding:10px 10px;border-bottom:1px solid rgba(26,45,74,.5);font-size:11px;text-align:right;vertical-align:middle}
.ptbl td:first-child{text-align:left}
.ptbl tr:last-child td{border-bottom:none}
.ptbl tr:hover td{background:var(--bg3)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
/* leaderboard */
.lbrow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid rgba(26,45,74,.5)}
.lbrow:last-child{border-bottom:none}
.lbrank{font-family:'Bebas Neue';font-size:20px;width:34px;text-align:center}
.lbnick{flex:1;font-weight:700;font-size:12px}
.lbasset{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;text-align:right}
.lbret{font-family:'IBM Plex Mono';font-size:10px;text-align:right;min-width:58px}
.m1{color:#FFD700}.m2{color:#C0C0C0}.m3{color:#CD7F32}
.lbme{background:rgba(240,180,41,.07);border-radius:8px}
/* schedule */
.sgrow{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid rgba(26,45,74,.5);font-size:11px}
.sgrow:last-child{border-bottom:none}
.stime{color:var(--muted);font-size:9px;min-width:38px;text-align:right;font-family:'IBM Plex Mono'}
.svenue{color:var(--muted);font-size:9px;min-width:140px;text-align:right}
.dhead{font-size:10px;color:var(--gold);font-weight:700;padding:6px 12px;background:rgba(240,180,41,.06);border:1px solid rgba(240,180,41,.12);border-radius:8px 8px 0 0;border-bottom:none}
/* predictions */
.pgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.prd{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.pbadge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;margin-bottom:7px}
.pcmt{font-size:11px;color:#94A3B8;line-height:1.7}
/* admin */
.agd{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
.ac{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.ag3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px}
.ainp{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:12px;width:100%;font-family:'IBM Plex Mono';outline:none}
.ainp:focus{border-color:var(--gold)}
.ainplbl{font-size:8px;color:var(--muted);margin-bottom:2px;font-weight:700;letter-spacing:.3px}
.updBtn{background:rgba(240,180,41,.12);color:var(--gold);border:1px solid rgba(240,180,41,.25);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:10px;font-weight:700;font-family:'Noto Sans KR';white-space:nowrap;transition:.15s}
.updBtn:hover{background:rgba(240,180,41,.22)}
.delbtn{background:rgba(255,59,86,.1);color:var(--red);border:1px solid rgba(255,59,86,.2);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:10px;font-family:'Noto Sans KR';transition:.15s;flex-shrink:0}
.delbtn:hover{background:rgba(255,59,86,.22)}
.addform{display:grid;grid-template-columns:110px 1fr 1fr 70px 1fr auto;gap:6px;align-items:end;margin-bottom:11px}
@media(max-width:900px){.addform{grid-template-columns:1fr 1fr;}}
.afinp{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:11px;width:100%;font-family:'Noto Sans KR';outline:none}
.afinp:focus{border-color:var(--gold)}
.afinp option{background:#111E35}
.addbtn{background:rgba(14,224,122,.12);color:var(--green);border:1px solid rgba(14,224,122,.25);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:700;font-family:'Noto Sans KR';white-space:nowrap}
.addbtn:hover{background:rgba(14,224,122,.22)}
.cmt-inp{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:11px;font-family:'Noto Sans KR';outline:none;resize:none}
.cmt-inp:focus{border-color:var(--gold)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0B1525;border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:12px;z-index:2000;white-space:nowrap;pointer-events:none}
.tok{border-color:rgba(14,224,122,.35);color:var(--green)}.terr{border-color:rgba(255,59,86,.35);color:var(--red)}
.alert{border-radius:8px;padding:9px 13px;font-size:11px;margin-bottom:11px;display:flex;align-items:flex-start;gap:6px;line-height:1.6}
.alertw{background:rgba(255,59,86,.07);border:1px solid rgba(255,59,86,.18);color:#FF8A9A}
.alerti{background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.15);color:#B8944E}
@media(max-width:900px){
  .market-layout{flex-direction:column}
  .standings-panel{width:100%;position:static}
}
@media(max-width:768px){
  .hdr{padding:0 12px;gap:8px}.nav{gap:1px}.nb{padding:4px 6px;font-size:9px}
  .main{padding:14px 12px}.tgrid{grid-template-columns:repeat(2,1fr)}
  .pgrid{grid-template-columns:repeat(2,1fr)}.ua .chip{display:none}
  .svenue{display:none}
}
</style>
</head>

function todayStr(){
  const d=new Date();
  const days=['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}

function calcPrice(prevP,newR,prevR,w,l){
  const d=prevR-newR;
  const rs=d>=3?9:d===2?6:d===1?3:d===-1?-3:d===-2?-6:d<=-3?-9:0;
  const tot=w+l;const wr=tot>0?w/tot:0.5;
  const ws=wr>=1?6:wr>=0.67?3:wr>=0.5?0:wr>=0.33?-3:-6;
  return Math.max(10000,Math.round(prevP*(1+(rs+ws)/100)));
}

function Sparkline({data,width=68,height=24}){
  if(!data||data.length<2)return<div style={{width,height,display:'inline-block'}}/>;
  const min=Math.min(...data);const max=Math.max(...data);const range=max-min||1;
  const pts=data.map((v,i)=>`${i/(data.length-1)*width},${height-(v-min)/range*(height-3)+1.5}`).join(' ');
  const up=data[data.length-1]>=data[0];
  return(
    <svg width={width} height={height} style={{display:'block',overflow:'visible'}}>
      <polyline points={pts} fill="none" stroke={up?'#0EE07A':'#FF3B56'} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={data.length>1?(1)*width:0} cy={height-(data[data.length-1]-min)/range*(height-3)+1.5} r="2.5" fill={up?'#0EE07A':'#FF3B56'}/>
    </svg>
  );
}

          </div>
          <div className="cwrap">
            {filtered.length===0?<div className="empty"><div style={{fontSize:24,marginBottom:6}}>📭</div><p>검색 결과 없음</p></div>
              :filtered.map((g,i)=>{const h=gt(g.h),a=gt(g.a);if(!h||!a)return null;return(
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 11px',borderBottom:'1px solid rgba(26,45,74,.5)'}}>
                  <div style={{minWidth:70,color:'var(--gold)',fontWeight:700,fontSize:10,flexShrink:0}}>{g.d}</div>
                  <div style={{flex:1,display:'flex',alignItems:'center',gap:4,fontWeight:700}}>
                    <TeamBadge team={a} size={18}/><span style={{fontSize:10}}>{a.s}</span>
                    <span style={{color:'var(--muted)',fontSize:8}}>VS</span>
                    <span style={{fontSize:10}}>{h.s}</span><TeamBadge team={h} size={18}/>
                  </div>
                  <div className="mono" style={{fontSize:9,color:'var(--muted)',flexShrink:0}}>{g.t}</div>
                  <div style={{fontSize:9,color:'var(--muted)',minWidth:100,textAlign:'right',flexShrink:0}}>{g.v}</div>
                  <button className="delbtn" onClick={()=>onDelGame(g._i)}>삭제</button>
                </div>
              );})}
          </div>
        </div>
      )}

      {adminTab==='comment'&&(
        <div>
          <div className="alert alerti" style={{marginBottom:13}}>💬 팀별 코멘트를 작성하세요. 마켓 카드와 예측 탭에 표시됩니다.<br/>예) "불펜 많이 쓴 롯데, 다음 경기 글쎄...?" / "KT 선발진 완벽, 황제주 등극"</div>
          <div className="agd">
            {TEAMS.map(team=>{const p=PRED_META[team.id];return(
              <div key={team.id} className="ac">
                <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:7}}>
                  <TeamBadge team={team} size={28}/>
                  <div><div style={{fontWeight:700,fontSize:11}}>{team.name}</div>
                    <span className="pbadge" style={{background:p.col+'22',color:p.col,border:`1px solid ${p.col}44`,padding:'2px 7px',fontSize:9}}>{p.em} {p.lbl}</span>
                  </div>
                </div>
                <textarea className="cmt-inp" rows={3} value={editCmt[team.id]||''} onChange={e=>setEditCmt(prev=>({...prev,[team.id]:e.target.value}))} placeholder="팀 코멘트 입력..."/>
                <button className="updBtn" style={{marginTop:5,width:'100%',textAlign:'center'}} onClick={()=>onSaveComment(team.id,editCmt[team.id])}>저장</button>
              </div>
            );})}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState('market');
  const [user,setUser]=useState(null);const [showLogin,setShowLogin]=useState(false);
  const [stocks,setStocks]=useState(()=>{try{const s=localStorage.getItem('kbs_stk');return s?JSON.parse(s):S0;}catch{return S0;}});
  const [port,setPort]=useState({});const [cash,setCash]=useState(IC);
  const [trade,setTrade]=useState(null);const [toast,setToast]=useState(null);
  const [mopen,setMopen]=useState(true);
  const [priceHistory,setPriceHistory]=useState(()=>{try{const s=localStorage.getItem('kbs_hist');return s?JSON.parse(s):Object.fromEntries(TEAMS.map(t=>[t.id,[S0[t.id].price]]));}catch{return Object.fromEntries(TEAMS.map(t=>[t.id,[S0[t.id].price]]));}});
  const [schedule,setSchedule]=useState(()=>{try{const s=localStorage.getItem('kbs_sch');return s?JSON.parse(s):SCH;}catch{return SCH;}});
  const [comments,setComments]=useState(()=>{try{const s=localStorage.getItem('kbs_cmt');return s?JSON.parse(s):{};}catch{return {};}});
  const [standings,setStandings]=useState(()=>{try{const s=localStorage.getItem('kbs_snd');return s?JSON.parse(s):STANDINGS_INIT;}catch{return STANDINGS_INIT;}});

  useEffect(()=>{/* setMopen(new Date().getDay()===1); */},[]);
  useEffect(()=>{if(!user)return;try{const s=localStorage.getItem(`kbs_u_${user.n}`);if(s){const{p,c}=JSON.parse(s);setPort(p||{});setCash(c!==undefined?c:IC);}else{setPort({});setCash(IC);}}catch{}},[user]);
  useEffect(()=>{if(user)try{localStorage.setItem(`kbs_u_${user.n}`,JSON.stringify({p:port,c:cash}));}catch{}},[port,cash,user]);
  useEffect(()=>{try{localStorage.setItem('kbs_stk',JSON.stringify(stocks));}catch{}},[stocks]);
  useEffect(()=>{try{localStorage.setItem('kbs_hist',JSON.stringify(priceHistory));}catch{}},[priceHistory]);
  useEffect(()=>{try{localStorage.setItem('kbs_sch',JSON.stringify(schedule));}catch{}},[schedule]);
  useEffect(()=>{try{localStorage.setItem('kbs_cmt',JSON.stringify(comments));}catch{}},[comments]);
  useEffect(()=>{try{localStorage.setItem('kbs_snd',JSON.stringify(standings));}catch{}},[standings]);

  const toast2=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};
  const sval=useMemo(()=>Object.entries(port).reduce((s,[id,h])=>s+h.shares*stocks[id].price,0),[port,stocks]);
  const total=cash+sval;const ret=(total-IC)/IC*100;

  const login=(n,p)=>{setUser({n,p});setShowLogin(false);toast2(`${n}님 환영합니다! ⚾`);};
  const logout=()=>{setUser(null);setPort({});setCash(IC);};
  const openTrade=(team,mode)=>{if(!user){setShowLogin(true);return;}if(!mopen){toast2('월요일에만 거래 가능합니다','err');return;}setTrade({team,mode});};
  const confirmTrade=(id,qty,mode)=>{
    const price=stocks[id].price;
    if(mode==='buy'){const cost=price*qty;if(cost>cash){toast2('예수금이 부족합니다','err');return;}
      setCash(c=>c-cost);setPort(p=>{const ex=p[id];if(ex){const ns=ex.shares+qty;return{...p,[id]:{shares:ns,avg:Math.round((ex.avg*ex.shares+price*qty)/ns)}};}return{...p,[id]:{shares:qty,avg:price}};});
      toast2(`${gt(id).name} ${qty}주 매수 완료! 💰`);
    }else{const h=port[id];if(!h||h.shares<qty){toast2('보유 수량 부족','err');return;}
      const rev=price*qty;setCash(c=>c+rev);setPort(p=>{const ns=p[id].shares-qty;if(ns===0){const n={...p};delete n[id];return n;}return{...p,[id]:{...p[id],shares:ns}};});
      toast2(`매도 완료! ${won(rev)} 입금 ✅`);
    }
    setTrade(null);
  };
  const updateStock=(id,np,nr,w,l)=>{
    setStocks(prev=>{const old=prev[id];return{...prev,[id]:{...old,prev:old.price,price:np,pr:old.rank,rank:nr,ch:(np-old.price)/old.price*100,rec:`${w}승${l}패`}};});
    setPriceHistory(prev=>({...prev,[id]:[...(prev[id]||[]),np].slice(-12)}));
    toast2(`${gt(id).name} 주가 업데이트! ✅`);
  };
  const addGame=g=>setSchedule(prev=>[...prev,g]);
  const delGame=i=>setSchedule(prev=>prev.filter((_,idx)=>idx!==i));
  const saveComment=(id,txt)=>{setComments(prev=>({...prev,[id]:txt}));toast2(`${gt(id).name} 코멘트 저장 ✅`);};
  const updateStandings=arr=>{setStandings(arr);toast2('순위표 업데이트 완료 ✅');};

  return(
    <div>
      <Ticker stocks={stocks}/>
      <Header user={user} tab={tab} setTab={setTab} onLogin={()=>setShowLogin(true)} onLogout={logout} total={total} ret={ret} mopen={mopen}/>
      <div className={`sbar ${mopen?'sopen':'sclosed'}`}>{mopen?'🟢 MARKET OPEN — 오늘 자정까지 거래 가능합니다':'🔴 MARKET CLOSED — 매주 월요일 00:00~23:59 거래 가능'}</div>
      <div className="main">
        {tab==='market'&&<MarketPage stocks={stocks} portfolio={port} cash={cash} user={user} mopen={mopen} onTrade={openTrade} schedule={schedule} priceHistory={priceHistory} comments={comments} standings={standings}/>}
        {tab==='portfolio'&&<PortfolioPage stocks={stocks} portfolio={port} cash={cash} total={total} ret={ret} user={user} priceHistory={priceHistory}/>}
        {tab==='lb'&&<LbPage user={user} total={total} ret={ret}/>}
        {tab==='sch'&&<SchPage schedule={schedule}/>}
        {tab==='pred'&&<PredPage stocks={stocks} comments={comments} priceHistory={priceHistory}/>}
        {tab==='admin'&&<AdminPage stocks={stocks} onUpdate={updateStock} mopen={mopen} onToggle={()=>setMopen(m=>!m)} schedule={schedule} onAddGame={addGame} onDelGame={delGame} comments={comments} onSaveComment={saveComment} standings={standings} onUpdateStandings={updateStandings}/>}
      </div>
      {showLogin&&<LoginModal onClose={()=>setShowLogin(false)} onLogin={login}/>}
      {trade&&<TradeModal team={trade.team} stock={stocks[trade.team.id]} mode={trade.mode} portfolio={port} cash={cash} onConfirm={confirmTrade} onClose={()=>setTrade(null)} comments={comments}/>}
      <Toast t={toast}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
